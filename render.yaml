services:
  - type: web
    name: kalshi-btc-sixty-percent
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q app.py engine.py strategy.py
    startCommand: python app.py
    healthCheckPath: /health
    disk:
      name: sixty-percent-paper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PAPER_DB_PATH
        value: /var/data/sixty_percent.sqlite3
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: DAILY_LOSS_LIMIT
        value: "250"
      - key: HOST
        value: 0.0.0.0
